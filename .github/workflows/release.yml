name: Production Release

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      # "true" when the build stopped because CHANGELOG.md has no section for
      # this version, so the Discord message can say that instead of a vague
      # "build failed".
      notes_missing: ${{ steps.notes.outputs.missing }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags -- both the versionCode (commit count) and
          # the next patch number (highest existing v<major.minor>.* tag)
          # below need them; the default shallow clone has neither.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compute version
        id: version
        run: |
          BASE_VERSION=$(grep '^VERSION_NAME=' app/version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          COMMIT_COUNT=$(git rev-list --count HEAD)

          # Next patch = 1 + the highest existing v<major.minor>.<patch> tag
          # for this major.minor line, or 0 if that line has no tags yet.
          LATEST_PATCH=$(git tag --list "v${BASE_VERSION}.*" \
            | sed -E "s/^v${BASE_VERSION}\.([0-9]+)$/\1/" \
            | sort -n \
            | tail -1)
          if [ -z "$LATEST_PATCH" ]; then
            NEXT_PATCH=0
          else
            NEXT_PATCH=$((LATEST_PATCH + 1))
          fi

          VERSION_NAME="${BASE_VERSION}.${NEXT_PATCH}"
          TAG_NAME="v${VERSION_NAME}"

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::Tag $TAG_NAME already exists -- refusing to overwrite a release."
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Check the release notes exist
        # Fail now, not after the build: CHANGELOG.md must have a section for
        # this version (see .github/scripts/release-notes.sh).
        id: notes
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          if ! .github/scripts/release-notes.sh "$VERSION_NAME" "$RUNNER_TEMP/release-notes.md"; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace \
            -PappVersionCode=${{ steps.version.outputs.version_code }} \
            -PappVersionName=${{ steps.version.outputs.version_name }}

      - name: Upload APK (hand-off to the release job)
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release tag and create the GitHub Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/

      - name: Write the release notes
        # The hand-written CHANGELOG.md section for this version is the body;
        # GitHub's generated "What's Changed" PR list is added below it.
        run: .github/scripts/release-notes.sh "${{ needs.build.outputs.version_name }}" "${{ runner.temp }}/release-notes.md"

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag_name }}
          name: ${{ needs.build.outputs.tag_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk

  notify:
    needs: [build, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          TAG_NAME: ${{ needs.build.outputs.tag_name }}
          NOTES_MISSING: ${{ needs.build.outputs.notes_missing }}
          # Built here, not passed as a job output: GitHub drops outputs that
          # contain a secret-looking string, and the repo name matches one.
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.build.outputs.tag_name }}
        run: |
          HINT=""
          if [ "$BUILD_RESULT" = "success" ] && [ "$RELEASE_RESULT" = "success" ]; then
            TITLE="🚀 RideLink production release published"
            COLOR=3066993
          elif [ "$NOTES_MISSING" = "true" ]; then
            TITLE="❌ RideLink production release stopped: no release notes for ${VERSION_NAME}"
            COLOR=15158332
            HINT="Open a small PR that renames \"## Unreleased\" in CHANGELOG.md to \"## ${VERSION_NAME} ($(date -u +%Y-%m-%d))\" and adds a fresh \"## Unreleased\" above it, merge it, then run Production Release again."
          elif [ "$BUILD_RESULT" != "success" ]; then
            TITLE="❌ RideLink production release failed (build)"
            COLOR=15158332
          else
            TITLE="❌ RideLink production release failed (release creation)"
            COLOR=15158332
          fi
          # No release was published unless both jobs succeeded: don't link one.
          if [ "$BUILD_RESULT" != "success" ] || [ "$RELEASE_RESULT" != "success" ]; then
            RELEASE_URL=""
          fi
          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --argjson color "$COLOR" \
            --arg version "${VERSION_NAME} (code ${VERSION_CODE})" \
            --arg tag "$TAG_NAME" \
            --arg release "$RELEASE_URL" \
            --arg hint "$HINT" \
            '{
              embeds: [{
                title: $title,
                color: $color,
                fields: (
                  [
                    {name: "Version", value: $version, inline: true},
                    {name: "Tag", value: $tag, inline: true}
                  ]
                  + (if $release != "" then [{name: "Release notes", value: $release, inline: false}] else [] end)
                  + (if $hint != "" then [{name: "What to do", value: $hint, inline: false}] else [] end)
                )
              }]
            }')
          curl -sS -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
